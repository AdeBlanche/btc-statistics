<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRC Price Statistics</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #8892a4;
      --green: #34d399;
      --red: #f87171;
      --accent: #818cf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }

    section { margin-bottom: 2.5rem; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    /* Price snapshot cards */
    .price-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }
    .card .label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .price { font-size: 1.75rem; font-weight: 700; }
    .card .change { font-size: 0.88rem; margin-top: 0.3rem; }
    .card .date-note { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .up   { color: var(--green); }
    .down { color: var(--red); }
    .neutral { color: var(--muted); }
    .card.highlight { border-color: var(--accent); }

    /* Stats table */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-item .stat-label { color: var(--muted); font-size: 0.85rem; }
    .stat-item .stat-value { font-weight: 600; font-size: 1rem; }

    /* Chart */
    canvas { width: 100% !important; display: block; }
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }
    .chart-controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .chart-controls button {
      background: var(--border);
      color: var(--muted);
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.9rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .chart-controls button.active,
    .chart-controls button:hover { background: var(--accent); color: #fff; }

    /* Volume bar */
    .vol-wrap { margin-top: 1.25rem; }
    .updated { font-size: 0.78rem; color: var(--muted); text-align: right; margin-top: 1rem; }
  </style>
</head>
<body>

<h1>STRC &mdash; Strategy Preferred Stock</h1>
<p class="subtitle" id="subtitle">Loading data&hellip;</p>

<section>
  <h2>Price Snapshot</h2>
  <div class="price-grid" id="snapshotGrid"></div>
</section>

<section>
  <h2>All-Time Statistics</h2>
  <div class="stats-grid" id="statsGrid"></div>
</section>

<section>
  <h2>Price Chart</h2>
  <div class="chart-wrap">
    <div class="chart-controls" id="chartControls"></div>
    <canvas id="priceChart" height="320"></canvas>
    <div class="vol-wrap">
      <canvas id="volChart" height="80"></canvas>
    </div>
  </div>
</section>

<section>
  <h2>Monthly View</h2>
  <div class="chart-wrap">
    <div class="chart-controls" id="monthControls"></div>
    <canvas id="monthChart" height="340"></canvas>
    <div id="monthLegend" style="display:flex;flex-wrap:wrap;gap:0.5rem 1.2rem;margin-top:0.9rem;font-size:0.78rem;"></div>
  </div>
</section>

<p class="updated" id="updatedLine"></p>

<script>
// ── Inline CSV (generated by Python) ──────────────────────────────────────────
const CSV_DATA = `DATE_PLACEHOLDER`;

// ── Parse CSV ─────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.slice(1).map(line => {
    const [date, open, high, low, close, volume] = line.split(',');
    return { date, open: +open, high: +high, low: +low, close: +close, volume: +volume };
  });
}

// ── Find closest row on or before target date ─────────────────────────────────
function findClosest(rows, targetDate) {
  let result = null;
  for (const r of rows) {
    if (r.date <= targetDate) result = r;
    else break;
  }
  return result;
}

function offsetDate(from, days) {
  const d = new Date(from + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function fmt(n) { return n != null ? '$' + n.toFixed(2) : 'N/A'; }
function pct(a, b) {
  if (a == null || b == null) return null;
  return ((b - a) / a * 100).toFixed(2);
}
function changeHTML(base, current) {
  const p = pct(base, current);
  if (p == null) return '<span class="neutral">N/A</span>';
  const cls = +p >= 0 ? 'up' : 'down';
  const sign = +p >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${p}%</span>`;
}

// ── Mini canvas chart (no dependencies) ──────────────────────────────────────
function drawChart(canvasId, labels, values, color, fill, height) {
  const canvas = document.getElementById(canvasId);
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  const H = height;
  canvas.width = W;
  ctx.clearRect(0, 0, W, H);

  if (values.length < 2) return;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const pad = { t: 10, b: 10, l: 55, r: 10 };

  const xScale = i => pad.l + (i / (values.length - 1)) * (W - pad.l - pad.r);
  const yScale = v => pad.t + (1 - (v - min) / range) * (H - pad.t - pad.b);

  // y-axis ticks
  ctx.fillStyle = '#8892a4';
  ctx.font = '11px Segoe UI, sans-serif';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = min + (range * i / ticks);
    const y = yScale(v);
    ctx.fillText('$' + v.toFixed(2), 0, y + 4);
    ctx.strokeStyle = '#2a2d3a';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
  }

  // fill
  if (fill) {
    const grad = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
    grad.addColorStop(0, color + '55');
    grad.addColorStop(1, color + '05');
    ctx.beginPath();
    ctx.moveTo(xScale(0), H - pad.b);
    values.forEach((v, i) => ctx.lineTo(xScale(i), yScale(v)));
    ctx.lineTo(xScale(values.length - 1), H - pad.b);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // line
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.lineJoin = 'round';
  values.forEach((v, i) => i === 0 ? ctx.moveTo(xScale(i), yScale(v)) : ctx.lineTo(xScale(i), yScale(v)));
  ctx.stroke();
}

function drawVolBars(canvasId, values, height) {
  const canvas = document.getElementById(canvasId);
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  canvas.width = W;
  ctx.clearRect(0, 0, W, H = height);

  const max = Math.max(...values);
  const pad = { l: 55, r: 10, b: 2 };
  const barW = Math.max(1, (W - pad.l - pad.r) / values.length - 1);

  values.forEach((v, i) => {
    const x = pad.l + (i / values.length) * (W - pad.l - pad.r);
    const h = (v / max) * (H - pad.b);
    ctx.fillStyle = '#818cf855';
    ctx.fillRect(x, H - pad.b - h, barW, h);
  });
}

// ── Main ──────────────────────────────────────────────────────────────────────
const rows = parseCSV(CSV_DATA);
const latest = rows[rows.length - 1];
const today = new Date().toISOString().slice(0, 10);

const snapshots = [
  { label: 'Current',  row: latest,                                          note: latest.date },
  { label: '1 Week Ago',   row: findClosest(rows, offsetDate(latest.date, -7)),  note: '' },
  { label: '1 Month Ago',  row: findClosest(rows, offsetDate(latest.date, -30)), note: '' },
  { label: '1 Year Ago',   row: findClosest(rows, offsetDate(latest.date, -365)),note: '' },
  { label: 'IPO Day',      row: rows[0],                                         note: rows[0].date },
];

// Snapshot cards
const grid = document.getElementById('snapshotGrid');
snapshots.forEach((s, idx) => {
  const price = s.row ? s.row.close : null;
  const base  = latest.close;
  const isLatest = idx === 0;
  const available = !!s.row;

  let changeLine = '';
  if (!isLatest && available) {
    changeLine = `<div class="change">vs now: ${changeHTML(price, base)}</div>`;
  }
  const noteDate = s.row ? s.row.date : '';

  grid.innerHTML += `
    <div class="card ${isLatest ? 'highlight' : ''}">
      <div class="label">${s.label}</div>
      <div class="price">${available ? fmt(price) : 'N/A'}</div>
      ${changeLine}
      <div class="date-note">${noteDate}</div>
    </div>`;
});

document.getElementById('subtitle').textContent =
  `Data: ${rows[0].date} → ${latest.date}  ·  ${rows.length} trading days`;

// All-time stats
const closes = rows.map(r => r.close);
const allTimeHigh = Math.max(...closes);
const allTimeLow  = Math.min(...closes);
const athRow = rows.find(r => r.close === allTimeHigh);
const atlRow = rows.find(r => r.close === allTimeLow);
const avgClose   = closes.reduce((a, b) => a + b, 0) / closes.length;
const totalVol   = rows.reduce((a, r) => a + r.volume, 0);
const avgVol     = totalVol / rows.length;
const stdDev     = Math.sqrt(closes.reduce((a, c) => a + Math.pow(c - avgClose, 2), 0) / closes.length);

const stats = [
  { label: 'All-Time High',   value: fmt(allTimeHigh) + ' (' + athRow.date + ')' },
  { label: 'All-Time Low',    value: fmt(allTimeLow)  + ' (' + atlRow.date + ')' },
  { label: 'Average Close',   value: fmt(avgClose) },
  { label: 'Std Deviation',   value: '$' + stdDev.toFixed(4) },
  { label: 'Total Volume',    value: (totalVol / 1e6).toFixed(1) + 'M shares' },
  { label: 'Avg Daily Volume',value: (avgVol / 1e3).toFixed(0) + 'K shares' },
  { label: 'IPO → Now',       value: changeHTML(rows[0].close, latest.close) + ' (' + fmt(rows[0].close) + ' → ' + fmt(latest.close) + ')' },
  { label: 'Trading Days',    value: rows.length },
];

const sg = document.getElementById('statsGrid');
stats.forEach(s => {
  sg.innerHTML += `<div class="stat-item"><span class="stat-label">${s.label}</span><span class="stat-value">${s.value}</span></div>`;
});

// Chart
let activeRange = 'all';
const ranges = { '1M': 30, '3M': 90, '6M': 180, 'All': null };
const controls = document.getElementById('chartControls');

function renderCharts(rangeKey) {
  activeRange = rangeKey;
  const days = ranges[rangeKey];
  const slice = days ? rows.slice(-Math.ceil(days * 365 / 252)) : rows;
  const labels = slice.map(r => r.date);
  const closes = slice.map(r => r.close);
  const vols   = slice.map(r => r.volume);
  drawChart('priceChart', labels, closes, '#818cf8', true, 320);
  drawVolBars('volChart', vols, 80);

  document.querySelectorAll('.chart-controls button').forEach(b => {
    b.classList.toggle('active', b.dataset.range === rangeKey);
  });
}

Object.keys(ranges).forEach(k => {
  const btn = document.createElement('button');
  btn.textContent = k;
  btn.dataset.range = k;
  btn.onclick = () => renderCharts(k);
  controls.appendChild(btn);
});

renderCharts('All');
window.addEventListener('resize', () => renderCharts(activeRange));

// ── Monthly overlay chart ─────────────────────────────────────────────────────
// Groups rows by YYYY-MM, then plots close vs day-of-month (1..31).
// Each month is one line; x-axis is calendar day, not trading day index.

const MONTH_COLORS = [
  '#818cf8','#34d399','#f87171','#fbbf24','#38bdf8','#a78bfa',
  '#fb923c','#4ade80','#f472b6','#e879f9','#22d3ee','#facc15',
];

function rowsByMonth(allRows) {
  const map = {};
  for (const r of allRows) {
    const key = r.date.slice(0, 7); // YYYY-MM
    if (!map[key]) map[key] = [];
    map[key].push(r);
  }
  return map;
}

function monthLabel(key) {
  const [y, m] = key.split('-');
  return new Date(+y, +m - 1, 1).toLocaleString('en-US', { month: 'short', year: '2-digit' });
}

function drawMonthChart(monthKeys, monthMap) {
  const canvas = document.getElementById('monthChart');
  const H = 340;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  canvas.width = W;
  ctx.clearRect(0, 0, W, H);

  const pad = { t: 14, b: 28, l: 55, r: 14 };

  // collect all values across selected months for y scale
  let allVals = [];
  for (const key of monthKeys) {
    for (const r of (monthMap[key] || [])) allVals.push(r.close);
  }
  if (allVals.length === 0) return;

  const minV = Math.min(...allVals);
  const maxV = Math.max(...allVals);
  const range = maxV - minV || 1;

  const xScale = d => pad.l + ((d - 1) / 30) * (W - pad.l - pad.r); // day 1..31
  const yScale = v => pad.t + (1 - (v - minV) / range) * (H - pad.t - pad.b);

  // grid lines + y labels
  ctx.font = '11px Segoe UI, sans-serif';
  ctx.fillStyle = '#8892a4';
  const ticks = 5;
  for (let i = 0; i <= ticks; i++) {
    const v = minV + (range * i / ticks);
    const y = yScale(v);
    ctx.fillText('$' + v.toFixed(2), 0, y + 4);
    ctx.strokeStyle = '#2a2d3a';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
  }

  // x-axis day labels
  ctx.fillStyle = '#8892a4';
  ctx.textAlign = 'center';
  for (const d of [1, 5, 10, 15, 20, 25, 31]) {
    const x = xScale(d);
    ctx.fillText(d, x, H - pad.b + 14);
    ctx.strokeStyle = '#2a2d3a';
    ctx.lineWidth = 0.3;
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, H - pad.b); ctx.stroke();
  }
  ctx.textAlign = 'left';

  // dashed $100 reference line
  const y100 = yScale(100);
  if (y100 >= pad.t && y100 <= H - pad.b) {
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, y100);
    ctx.lineTo(W - pad.r, y100);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '10px Segoe UI, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('$100', pad.l - 2, y100 + 4);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  // one line per month
  monthKeys.forEach((key, idx) => {
    const pts = (monthMap[key] || []).map(r => ({
      d: +r.date.slice(8, 10),
      v: r.close,
    })).sort((a, b) => a.d - b.d);
    if (pts.length < 1) return;

    const color = MONTH_COLORS[idx % MONTH_COLORS.length];
    const isCurrent = key === latest.date.slice(0, 7);

    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = isCurrent ? 2.5 : 1.4;
    ctx.globalAlpha = isCurrent ? 1 : 0.65;
    ctx.lineJoin = 'round';
    pts.forEach((p, i) => {
      const x = xScale(p.d), y = yScale(p.v);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // dot at last known point for current month
    if (isCurrent) {
      const last = pts[pts.length - 1];
      ctx.beginPath();
      ctx.arc(xScale(last.d), yScale(last.v), 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}

function renderMonthChart(rangeKey) {
  const map = rowsByMonth(rows);
  const allKeys = Object.keys(map).sort();
  const currentKey = latest.date.slice(0, 7);

  let keys;
  if (rangeKey === 'current') {
    keys = [currentKey];
  } else if (rangeKey === 'last') {
    const d = new Date(latest.date + 'T00:00:00Z');
    d.setUTCMonth(d.getUTCMonth() - 1);
    const lastKey = d.toISOString().slice(0, 7);
    keys = allKeys.filter(k => k === lastKey);
  } else {
    const monthsBack = { 'quarter': 3, '6m': 6, '1yr': 12 }[rangeKey];
    const cutoff = new Date(latest.date + 'T00:00:00Z');
    cutoff.setUTCMonth(cutoff.getUTCMonth() - monthsBack + 1);
    cutoff.setUTCDate(1);
    const cutoffKey = cutoff.toISOString().slice(0, 7);
    keys = allKeys.filter(k => k >= cutoffKey);
  }

  drawMonthChart(keys, map);

  // legend
  const legend = document.getElementById('monthLegend');
  legend.innerHTML = '';
  keys.forEach((key, idx) => {
    const color = MONTH_COLORS[idx % MONTH_COLORS.length];
    const isCurrent = key === currentKey;
    legend.innerHTML += `<span style="display:flex;align-items:center;gap:4px;">
      <span style="display:inline-block;width:22px;height:3px;background:${color};border-radius:2px;opacity:${isCurrent?1:0.7}"></span>
      <span style="color:${isCurrent?'#e2e8f0':'#8892a4'}">${monthLabel(key)}${isCurrent?' ★':''}</span>
    </span>`;
  });

  document.querySelectorAll('#monthControls button').forEach(b => {
    b.classList.toggle('active', b.dataset.mrange === rangeKey);
  });
}

const monthRanges = [
  { key: 'current', label: 'This Month' },
  { key: 'last',    label: 'Last Month' },
  { key: 'quarter', label: '3 Months' },
  { key: '6m',      label: '6 Months' },
  { key: '1yr',     label: '1 Year' },
];
const mc = document.getElementById('monthControls');
monthRanges.forEach(({ key, label }) => {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.dataset.mrange = key;
  btn.onclick = () => renderMonthChart(key);
  mc.appendChild(btn);
});

renderMonthChart('current');
window.addEventListener('resize', () => {
  renderCharts(activeRange);
  // re-read active month range from button
  const activeMonth = document.querySelector('#monthControls button.active');
  if (activeMonth) renderMonthChart(activeMonth.dataset.mrange);
});

document.getElementById('updatedLine').textContent =
  'Last updated: ' + latest.date + ' · Source: Yahoo Finance';
</script>
</body>
</html>
