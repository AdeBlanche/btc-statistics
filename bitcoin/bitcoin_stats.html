<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Price Statistics</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #8892a4;
      --green: #34d399;
      --red: #f87171;
      --accent: #f7931a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }

    section { margin-bottom: 2.5rem; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    /* Price snapshot cards */
    .price-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }
    .card .label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .price { font-size: 1.75rem; font-weight: 700; }
    .card .change { font-size: 0.88rem; margin-top: 0.3rem; }
    .card .date-note { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .up   { color: var(--green); }
    .down { color: var(--red); }
    .neutral { color: var(--muted); }
    .card.highlight { border-color: var(--accent); }

    /* Stats table */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .stat-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-item .stat-label { color: var(--muted); font-size: 0.85rem; }
    .stat-item .stat-value { font-weight: 600; font-size: 1rem; }

    /* Chart */
    canvas { width: 100% !important; display: block; }
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }
    .chart-controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .chart-controls button {
      background: var(--border);
      color: var(--muted);
      border: none;
      border-radius: 6px;
      padding: 0.35rem 0.9rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .chart-controls button.active,
    .chart-controls button:hover { background: var(--accent); color: #fff; }

    /* Volume bar */
    .vol-wrap { margin-top: 1.25rem; }
    .updated { font-size: 0.78rem; color: var(--muted); text-align: right; margin-top: 1rem; }
  </style>
</head>
<body>

<h1>Bitcoin (BTC) &mdash; Price Statistics</h1>
<p class="subtitle" id="subtitle">Loading data&hellip;</p>

<section>
  <h2>Price Snapshot</h2>
  <div class="price-grid" id="snapshotGrid"></div>
</section>

<section>
  <h2>All-Time Statistics</h2>
  <div class="stats-grid" id="statsGrid"></div>
</section>

<section>
  <h2>Price Chart</h2>
  <div class="chart-wrap">
    <div class="chart-controls" id="chartControls"></div>
    <canvas id="priceChart" height="320"></canvas>
    <div class="vol-wrap">
      <canvas id="volChart" height="80"></canvas>
    </div>
  </div>
</section>

<section>
  <h2>4-Year Halving Cycle View</h2>
  <div class="chart-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;">
      <div class="chart-controls" id="cycleControls" style="margin-bottom:0;"></div>
      <div style="display:flex;gap:0.5rem;">
        <button id="cycleAlignBtn" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:0.35rem 0.9rem;font-size:0.82rem;cursor:pointer;">Align Halvings</button>
        <button id="cycleScaleBtn" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:0.35rem 0.9rem;font-size:0.82rem;cursor:pointer;">Linear Scale</button>
      </div>
    </div>
    <canvas id="cycleChart" height="460"></canvas>
    <div id="cycleLegend" style="display:flex;flex-wrap:wrap;gap:0.5rem 1.2rem;margin-top:0.9rem;font-size:0.78rem;"></div>
  </div>
</section>


<p class="updated" id="updatedLine"></p>

<script>
// ── Inline CSV (generated by Python) ──────────────────────────────────────────
const CSV_DATA = `DATE_PLACEHOLDER`;

// ── Parse CSV ─────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.slice(1).map(line => {
    const [date, open, high, low, close, volume] = line.split(',');
    return { date, open: +open, high: +high, low: +low, close: +close, volume: +volume };
  });
}

function findClosest(rows, targetDate) {
  let result = null;
  for (const r of rows) {
    if (r.date <= targetDate) result = r;
    else break;
  }
  return result;
}

function offsetDate(from, days) {
  const d = new Date(from + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function fmt(n) {
  if (n == null) return 'N/A';
  if (n >= 1000) return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  return '$' + n.toFixed(2);
}

function pct(a, b) {
  if (a == null || b == null) return null;
  return ((b - a) / a * 100).toFixed(2);
}
function changeHTML(base, current) {
  const p = pct(base, current);
  if (p == null) return '<span class="neutral">N/A</span>';
  const cls = +p >= 0 ? 'up' : 'down';
  const sign = +p >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${p}%</span>`;
}

// ── Mini canvas chart (no dependencies) ──────────────────────────────────────
function drawChart(canvasId, labels, values, color, fill, height) {
  const canvas = document.getElementById(canvasId);
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  const H = height;
  canvas.width = W;
  ctx.clearRect(0, 0, W, H);

  if (values.length < 2) return;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const pad = { t: 10, b: 10, l: 75, r: 10 };

  const xScale = i => pad.l + (i / (values.length - 1)) * (W - pad.l - pad.r);
  const yScale = v => pad.t + (1 - (v - min) / range) * (H - pad.t - pad.b);

  // y-axis ticks
  ctx.fillStyle = '#8892a4';
  ctx.font = '11px Segoe UI, sans-serif';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = min + (range * i / ticks);
    const y = yScale(v);
    const label = v >= 1000 ? '$' + Math.round(v / 1000) + 'k' : '$' + v.toFixed(0);
    ctx.fillText(label, 0, y + 4);
    ctx.strokeStyle = '#2a2d3a';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
  }

  // fill
  if (fill) {
    const grad = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
    grad.addColorStop(0, color + '55');
    grad.addColorStop(1, color + '05');
    ctx.beginPath();
    ctx.moveTo(xScale(0), H - pad.b);
    values.forEach((v, i) => ctx.lineTo(xScale(i), yScale(v)));
    ctx.lineTo(xScale(values.length - 1), H - pad.b);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // line
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.lineJoin = 'round';
  values.forEach((v, i) => i === 0 ? ctx.moveTo(xScale(i), yScale(v)) : ctx.lineTo(xScale(i), yScale(v)));
  ctx.stroke();
}

function drawVolBars(canvasId, values, height) {
  const canvas = document.getElementById(canvasId);
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  const H = height;
  canvas.width = W;
  ctx.clearRect(0, 0, W, H);

  const max = Math.max(...values);
  const pad = { l: 75, r: 10, b: 2 };
  const barW = Math.max(1, (W - pad.l - pad.r) / values.length - 1);

  values.forEach((v, i) => {
    const x = pad.l + (i / values.length) * (W - pad.l - pad.r);
    const h = (v / max) * (H - pad.b);
    ctx.fillStyle = '#f7931a55';
    ctx.fillRect(x, H - pad.b - h, barW, h);
  });
}

// ── Main ──────────────────────────────────────────────────────────────────────
const rows = parseCSV(CSV_DATA);
const latest = rows[rows.length - 1];

const snapshots = [
  { label: 'Current',      row: latest,                                           note: latest.date },
  { label: '1 Week Ago',   row: findClosest(rows, offsetDate(latest.date, -7)),   note: '' },
  { label: '1 Month Ago',  row: findClosest(rows, offsetDate(latest.date, -30)),  note: '' },
  { label: '1 Year Ago',   row: findClosest(rows, offsetDate(latest.date, -365)), note: '' },
  { label: 'Genesis Era',  row: rows[0],                                           note: rows[0].date },
];

// Snapshot cards
const grid = document.getElementById('snapshotGrid');
grid.innerHTML = snapshots.map((s, idx) => {
  const price     = s.row ? s.row.close : null;
  const isLatest  = idx === 0;
  const available = !!s.row;
  const changeLine = (!isLatest && available)
    ? `<div class="change">vs now: ${changeHTML(price, latest.close)}</div>`
    : '';
  return `<div class="card ${isLatest ? 'highlight' : ''}">
      <div class="label">${s.label}</div>
      <div class="price">${available ? fmt(price) : 'N/A'}</div>
      ${changeLine}
      <div class="date-note">${s.row ? s.row.date : ''}</div>
    </div>`;
}).join('');

document.getElementById('subtitle').textContent =
  `Data: ${rows[0].date} → ${latest.date}  ·  ${rows.length} days`;

// All-time stats
const closes = rows.map(r => r.close);
const allTimeHigh = Math.max(...closes);
const allTimeLow  = Math.min(...closes);
const athRow = rows.find(r => r.close === allTimeHigh);
const atlRow = rows.find(r => r.close === allTimeLow);
const avgClose = closes.reduce((a, b) => a + b, 0) / closes.length;
const totalVol = rows.reduce((a, r) => a + (r.volume || 0), 0);
const avgVol   = totalVol / rows.length;
const stdDev   = Math.sqrt(closes.reduce((a, c) => a + Math.pow(c - avgClose, 2), 0) / closes.length);

const stats = [
  { label: 'All-Time High',    value: fmt(allTimeHigh) + ' (' + athRow.date + ')' },
  { label: 'All-Time Low',     value: fmt(allTimeLow)  + ' (' + atlRow.date + ')' },
  { label: 'Average Close',    value: fmt(avgClose) },
  { label: 'Std Deviation',    value: fmt(stdDev) },
  { label: 'Avg Daily Volume', value: '$' + (avgVol / 1e9).toFixed(1) + 'B' },
  { label: 'Earliest → Now',   value: changeHTML(rows[0].close, latest.close) + ' (' + fmt(rows[0].close) + ' → ' + fmt(latest.close) + ')' },
  { label: 'Days of Data',     value: rows.length },
];

document.getElementById('statsGrid').innerHTML = stats
  .map(s => `<div class="stat-item"><span class="stat-label">${s.label}</span><span class="stat-value">${s.value}</span></div>`)
  .join('');

// Chart
let activeRange = 'all';
const ranges = { '1M': 30, '3M': 90, '6M': 180, '1Y': 365, 'All': null };
const controls = document.getElementById('chartControls');

function renderCharts(rangeKey) {
  activeRange = rangeKey;
  const days = ranges[rangeKey];
  const slice = days ? rows.slice(-days) : rows;
  const labels = slice.map(r => r.date);
  const closesSlice = slice.map(r => r.close);
  const vols = slice.map(r => r.volume || 0);
  drawChart('priceChart', labels, closesSlice, '#f7931a', true, 320);
  drawVolBars('volChart', vols, 80);

  document.querySelectorAll('.chart-controls button').forEach(b => {
    b.classList.toggle('active', b.dataset.range === rangeKey);
  });
}

Object.keys(ranges).forEach(k => {
  const btn = document.createElement('button');
  btn.textContent = k;
  btn.dataset.range = k;
  btn.onclick = () => renderCharts(k);
  controls.appendChild(btn);
});

renderCharts('All');

const HALVINGS = [
  { label: 'Cycle 1 (2012)', date: '2012-11-28', color: '#38bdf8' },
  { label: 'Cycle 2 (2016)', date: '2016-07-09', color: '#a78bfa' },
  { label: 'Cycle 3 (2020)', date: '2020-05-11', color: '#34d399' },
  { label: 'Cycle 4 (2024)', date: '2024-04-20', color: '#f7931a' },
];
const CYCLE_DAYS = 1460; // 4 * 365
const currentCycleHalving = HALVINGS[3].date;

// Build a date→close lookup from rows
const dateIndex = {};
for (const r of rows) dateIndex[r.date] = r.close;

function isoToMs(iso) {
  return new Date(iso + 'T00:00:00Z').getTime();
}

// Price on a halving day (or nearest available date)
function halvingPrice(halvingDate) {
  if (dateIndex[halvingDate] != null) return dateIndex[halvingDate];
  // walk forward up to 7 days to find nearest available
  for (let d = 1; d <= 7; d++) {
    const dt = new Date(isoToMs(halvingDate) + d * 86400000);
    const iso = dt.toISOString().slice(0, 10);
    if (dateIndex[iso] != null) return dateIndex[iso];
  }
  return null;
}

const currentHalvingPrice = halvingPrice(currentCycleHalving);

function halvingDayOffset(halvingDate) {
  const c4 = new Date('2024-04-20T00:00:00Z');
  const hDate = new Date(halvingDate + 'T00:00:00Z');
  const hIn2024 = new Date(Date.UTC(2024, hDate.getUTCMonth(), hDate.getUTCDate()));
  return Math.round((hIn2024 - c4) / 86400000);
}

// Build cycle point arrays: [{day, price}] normalized so day-0 = currentHalvingPrice
function buildCyclePoints(halvingDate, dayOffset) {
  const startMs = isoToMs(halvingDate);
  const basePrice = halvingPrice(halvingDate);
  if (!basePrice || !currentHalvingPrice) return [];
  const scale = currentHalvingPrice / basePrice;
  const pts = [];
  for (const r of rows) {
    const dayN = Math.round((isoToMs(r.date) - startMs) / 86400000);
    if (dayN < 0) continue;
    if (dayN > CYCLE_DAYS) break;
    const shiftedDay = dayN + dayOffset;
    if (shiftedDay < 0 || shiftedDay > CYCLE_DAYS) continue;
    pts.push({ day: shiftedDay, price: r.close * scale });
  }
  return pts;
}

let cycleLogScale = true;
let activeCycleFilter = 'all'; // 'all' | cycle index string
let cycleAlignMode = 'halving'; // 'halving' | 'calendar'

function drawCycleChart() {
  const canvas = document.getElementById('cycleChart');
  const H = 460;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  canvas.width = W;
  ctx.clearRect(0, 0, W, H);

  const pad = { t: 14, b: 32, l: 75, r: 14 };
  const MARKER_R = 7;

  // Build cycle objects with points
  const cycles = HALVINGS.map((h, i) => ({
    ...h, idx: i,
    pts: buildCyclePoints(h.date, cycleAlignMode === 'calendar' ? halvingDayOffset(h.date) : 0),
  })).filter(c => c.pts.length > 0);

  const visibleCycles = activeCycleFilter === 'all'
    ? cycles
    : cycles.filter(c => String(c.idx) === activeCycleFilter);
  if (visibleCycles.length === 0) return;

  // Compute peak/trough for every cycle
  const cycleStats = cycles.map(cycle => {
    const peakPts = cycle.pts.filter(p => p.day <= 1095);
    if (!peakPts.length) return null;
    const peakPt   = peakPts.reduce((a, b) => b.price > a.price ? b : a);
    const afterPeak = cycle.pts.filter(p => p.day > peakPt.day);
    const troughPt  = afterPeak.length ? afterPeak.reduce((a, b) => b.price < a.price ? b : a) : null;
    return { cycle, peakPt, troughPt };
  }).filter(Boolean);

  const historicalStats = cycleStats.filter(s => s.cycle.date !== currentCycleHalving && s.troughPt);
  const currentStats    = cycleStats.find(s => s.cycle.date === currentCycleHalving);

  const avgDaysPeakToTrough = historicalStats.reduce((s, x) => s + (x.troughPt.day - x.peakPt.day), 0) / historicalStats.length;

  const ddRetains  = historicalStats.map((s, i) => ({ x: i + 1, y: s.troughPt.price / s.peakPt.price }));
  const n          = ddRetains.length;
  const mx         = ddRetains.reduce((s, p) => s + p.x, 0) / n;
  const my         = ddRetains.reduce((s, p) => s + p.y, 0) / n;
  const slope      = ddRetains.reduce((s, p) => s + (p.x - mx) * (p.y - my), 0) /
                     ddRetains.reduce((s, p) => s + (p.x - mx) ** 2, 0);
  const trendRetain = (my - slope * mx) + slope * (n + 1);

  let projectedTrough = null;
  if (currentStats) {
    const projDay   = Math.round(currentStats.peakPt.day + avgDaysPeakToTrough);
    const projPrice = currentStats.peakPt.price * trendRetain;
    if (projDay <= CYCLE_DAYS) projectedTrough = { day: projDay, price: projPrice, trendDdPct: (1 - trendRetain) * 100 };
  }

  const allPrices = visibleCycles.flatMap(c => c.pts.map(p => p.price)).filter(v => v > 0);
  if (projectedTrough) allPrices.push(projectedTrough.price);
  if (!allPrices.length) return;

  const minP = allPrices.reduce((a, b) => a < b ? a : b);
  const maxP = allPrices.reduce((a, b) => a > b ? a : b);
  const toLog    = v => Math.log10(Math.max(v, 1));
  const minYRaw  = cycleLogScale ? toLog(minP) : minP;
  const maxYRaw  = cycleLogScale ? toLog(maxP) : maxP;
  const margin   = (maxYRaw - minYRaw) * 0.12;
  const minY     = minYRaw - margin;
  const maxY     = maxYRaw + margin;
  const rangeY   = maxY - minY || 1;

  const c4StartMs = isoToMs(currentCycleHalving);
  const xScale = day => pad.l + (day / CYCLE_DAYS) * (W - pad.l - pad.r);

  const yScale = v => {
    const val = cycleLogScale ? toLog(v) : v;
    return pad.t + (1 - (val - minY) / rangeY) * (H - pad.t - pad.b);
  };

  function drawTriangle(x, y, pointUp, color) {
    const draw = () => {
      ctx.beginPath();
      if (pointUp) {
        ctx.moveTo(x, y - MARKER_R); ctx.lineTo(x + MARKER_R, y + MARKER_R); ctx.lineTo(x - MARKER_R, y + MARKER_R);
      } else {
        ctx.moveTo(x, y + MARKER_R); ctx.lineTo(x + MARKER_R, y - MARKER_R); ctx.lineTo(x - MARKER_R, y - MARKER_R);
      }
      ctx.closePath();
    };
    draw(); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5; ctx.stroke();
    draw(); ctx.fillStyle = color; ctx.fill();
  }

  // Y-axis ticks
  ctx.font = '11px Segoe UI, sans-serif';
  const yTicks = cycleLogScale
    ? [100, 1000, 5000, 10000, 30000, 50000, 100000, 200000].filter(v => v >= minP * 0.5 && v <= maxP * 2)
    : (() => { const t = []; for (let i = 0; i <= 5; i++) t.push(minP + (maxP - minP) * i / 5); return t; })();
  for (const v of yTicks) {
    const y = yScale(v);
    if (y < pad.t || y > H - pad.b) continue;
    ctx.fillStyle = '#8892a4';
    ctx.fillText(v >= 1000 ? '$' + Math.round(v / 1000) + 'k' : '$' + v.toFixed(0), 0, y + 4);
    ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
  }

  // X-axis ticks (real dates from C4 halving)
  ctx.textAlign = 'center';
  const xTickDays = [0, 182, 365, 547, 730, 912, 1095, 1277, 1460];
  for (const d of xTickDays) {
    const x = xScale(d);
    const lbl = new Date(c4StartMs + d * 86400000).toLocaleString('en-US', { month: 'short', year: '2-digit', timeZone: 'UTC' });
    ctx.fillStyle = '#8892a4'; ctx.fillText(lbl, x, H - pad.b + 16);
    ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.3;
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, H - pad.b); ctx.stroke();
  }
  ctx.textAlign = 'left';

  // Draw lines + markers
  for (const { cycle, peakPt, troughPt } of cycleStats.filter(s => visibleCycles.includes(s.cycle))) {
    const isCurrent = cycle.date === currentCycleHalving;

    ctx.beginPath();
    ctx.strokeStyle = cycle.color;
    ctx.lineWidth = isCurrent ? 2.5 : 1.5;
    ctx.globalAlpha = isCurrent ? 1 : 0.7;
    ctx.lineJoin = 'round';
    let first = true;
    for (const p of cycle.pts) {
      const x = xScale(p.day), y = yScale(p.price);
      first ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      first = false;
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Peak
    const px = xScale(peakPt.day), py = yScale(peakPt.price);
    drawTriangle(px, py, true, cycle.color);
    ctx.font = '10px Segoe UI, sans-serif';
    ctx.fillStyle = cycle.color;
    ctx.textAlign = 'center';
    ctx.fillText(fmt(peakPt.price / (currentHalvingPrice / halvingPrice(cycle.date))), px, py - MARKER_R - 3);

    // Trough (confirmed)
    if (troughPt) {
      const tx = xScale(troughPt.day), ty = yScale(troughPt.price);
      drawTriangle(tx, ty, false, cycle.color);
      ctx.fillStyle = cycle.color;
      ctx.fillText(fmt(troughPt.price / (currentHalvingPrice / halvingPrice(cycle.date))), tx, ty + MARKER_R + 11);
    }
    ctx.textAlign = 'left';

    // Current cycle end dot
    if (isCurrent) {
      const last = cycle.pts[cycle.pts.length - 1];
      ctx.beginPath();
      ctx.arc(xScale(last.day), yScale(last.price), 4, 0, Math.PI * 2);
      ctx.fillStyle = cycle.color; ctx.fill();
    }
  }

  const showProjected = projectedTrough && (activeCycleFilter === 'all' || activeCycleFilter === String(HALVINGS.length - 1));
  if (showProjected) {
    const projColor = 'rgba(251,191,36,0.75)';
    const tx = xScale(projectedTrough.day);
    const ty = yScale(projectedTrough.price);

    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = projColor; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tx, pad.t); ctx.lineTo(tx, H - pad.b); ctx.stroke();
    ctx.restore();

    const drawProjTri = () => {
      ctx.beginPath();
      ctx.moveTo(tx, ty + MARKER_R); ctx.lineTo(tx + MARKER_R, ty - MARKER_R); ctx.lineTo(tx - MARKER_R, ty - MARKER_R);
      ctx.closePath();
    };
    ctx.save(); ctx.setLineDash([3, 3]);
    drawProjTri(); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    drawProjTri(); ctx.fillStyle = projColor; ctx.fill();

    const realProjPrice = projectedTrough.price / (currentHalvingPrice / halvingPrice(currentCycleHalving));
    ctx.font = '10px Segoe UI, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(251,191,36,0.9)';
    ctx.fillText(fmt(realProjPrice), tx, ty + MARKER_R + 11);
    ctx.fillStyle = 'rgba(251,191,36,0.6)';
    ctx.fillText('day ' + projectedTrough.day, tx, ty + MARKER_R + 22);
    ctx.textAlign = 'left';
  }

  // Legend
  const legend = document.getElementById('cycleLegend');
  let legendHtml = '';
  for (const { cycle } of cycleStats) {
    const isCurrent  = cycle.date === currentCycleHalving;
    const dayCount   = cycle.pts.length > 0 ? cycle.pts[cycle.pts.length - 1].day : 0;
    const isActive   = activeCycleFilter === 'all' || String(cycle.idx) === activeCycleFilter;
    const hp         = halvingPrice(cycle.date);
    const mult = isCurrent ? (latest.close / hp).toFixed(1) : (currentHalvingPrice / hp).toFixed(1);
    const stat = cycleStats.find(s => s.cycle.date === cycle.date);
    const dropMult = stat && stat.troughPt ? (stat.troughPt.price / stat.peakPt.price).toFixed(2) : null;
    const dropStr = dropMult != null ? ' → ×' + dropMult : '';
    const scaleLabel = 'halving $' + Math.round(hp).toLocaleString() + ' → ×' + mult
      + dropStr + (isCurrent ? ', day ' + dayCount : '');
    legendHtml += `<span style="display:flex;align-items:center;gap:4px;cursor:pointer;opacity:${isActive?1:0.35};" onclick="toggleCycleFilter('${cycle.idx}')">
      <span style="display:inline-block;width:22px;height:3px;background:${cycle.color};border-radius:2px;"></span>
      <span style="color:${isCurrent?'#e2e8f0':'#8892a4'}">${cycle.label}${isCurrent?' ★':''} <span style="color:var(--muted);font-size:0.72rem;">(${scaleLabel})</span></span>
    </span>`;
  }
  if (projectedTrough) {
    const realProjPrice = projectedTrough.price / (currentHalvingPrice / halvingPrice(currentCycleHalving));
    const projDateStr   = new Date(isoToMs(currentCycleHalving) + projectedTrough.day * 86400000)
      .toLocaleString('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' });
    legendHtml += `<span style="display:flex;align-items:center;gap:4px;">
      <span style="display:inline-block;width:22px;height:3px;background:rgba(251,191,36,0.7);border-radius:2px;border:1px dashed rgba(251,191,36,0.8);"></span>
      <span style="color:#8892a4;">Projected low <span style="color:var(--muted);font-size:0.72rem;">(day ${projectedTrough.day} ≈ ${projDateStr} → ×${(1 - projectedTrough.trendDdPct / 100).toFixed(3)})</span></span>
    </span>`;
  }
  legend.innerHTML = legendHtml;
}

function toggleCycleFilter(idx) {
  activeCycleFilter = activeCycleFilter === idx ? 'all' : idx;
  drawCycleChart();
}

// Align toggle button
const alignBtn = document.getElementById('cycleAlignBtn');
alignBtn.addEventListener('click', () => {
  cycleAlignMode = cycleAlignMode === 'halving' ? 'calendar' : 'halving';
  alignBtn.textContent = cycleAlignMode === 'halving' ? 'Align Halvings' : 'Align Calendar';
  alignBtn.style.background = cycleAlignMode === 'halving' ? 'var(--accent)' : 'var(--border)';
  alignBtn.style.color = cycleAlignMode === 'halving' ? '#fff' : 'var(--muted)';
  drawCycleChart();
});

// Scale toggle button
const scaleBtn = document.getElementById('cycleScaleBtn');
scaleBtn.addEventListener('click', () => {
  cycleLogScale = !cycleLogScale;
  scaleBtn.textContent = cycleLogScale ? 'Linear Scale' : 'Log Scale';
  scaleBtn.style.background = cycleLogScale ? 'var(--accent)' : 'var(--border)';
  scaleBtn.style.color = cycleLogScale ? '#fff' : 'var(--muted)';
  drawCycleChart();
});

// Filter buttons: All + per-cycle
const cc = document.getElementById('cycleControls');
const allBtn = document.createElement('button');
allBtn.textContent = 'All Cycles';
allBtn.dataset.cycle = 'all';
allBtn.onclick = () => { activeCycleFilter = 'all'; drawCycleChart(); updateCycleBtns(); };
cc.appendChild(allBtn);

HALVINGS.forEach((h, i) => {
  const btn = document.createElement('button');
  btn.textContent = 'C' + (i + 1) + ' (' + h.date.slice(0, 4) + ')';
  btn.dataset.cycle = String(i);
  btn.onclick = () => { activeCycleFilter = String(i); drawCycleChart(); updateCycleBtns(); };
  cc.appendChild(btn);
});

function updateCycleBtns() {
  document.querySelectorAll('#cycleControls button').forEach(b => {
    b.classList.toggle('active', b.dataset.cycle === activeCycleFilter);
  });
}

drawCycleChart();
updateCycleBtns();

window.addEventListener('resize', () => {
  renderCharts(activeRange);
  drawCycleChart();
});

document.getElementById('updatedLine').textContent =
  'Last updated: ' + latest.date + ' · Source: CoinGecko';
</script>
</body>
</html>
